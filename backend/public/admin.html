<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doorphone — панель управления</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Toast ── */
    #toastContainer {
      position: fixed; top: 1rem; right: 1rem; z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none;
    }
    .toast {
      padding: 0.625rem 1rem; border-radius: var(--grg-r-sm);
      font-size: 13px; font-weight: 500; max-width: 360px;
      animation: toastIn 0.2s ease; pointer-events: auto;
      backdrop-filter: blur(12px);
    }
    @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    .toast.ok   { background:rgba(61,213,152,0.18); border:1px solid rgba(61,213,152,0.35); color:var(--grg-success); }
    .toast.err  { background:rgba(255,107,107,0.18); border:1px solid rgba(255,107,107,0.35); color:var(--grg-danger); }
    .toast.warn { background:rgba(246,195,68,0.18); border:1px solid rgba(246,195,68,0.35); color:var(--grg-warning); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: rgba(14,6,26,0.97); border: 1px solid var(--grg-glass-border);
      border-radius: var(--grg-r-lg); padding: 1.5rem;
      min-width: 320px; max-width: 480px;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .modal-title { font-family: var(--grg-font-display); font-size: 1rem; color: #fff; }
    .modal-body  { font-size: 13px; color: var(--grg-ink-200); line-height: 1.5; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* ── Camera modal ── */
    #cameraModal { z-index: 9000; }
    #cameraVideo { width: 100%; max-height: 60vh; border-radius: 8px; background: #000; display: block; }
    #cameraLoading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 8px; }
    #cameraLiveBadge { position: absolute; top: 8px; right: 8px; background: rgba(220,30,30,0.18); border: 1px solid rgba(220,30,30,0.4); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #ff5555; }
    #cameraOpenDoor { width: 100%; background: linear-gradient(135deg, var(--grg-primary), #5a4fd6); color: #fff; border: none; border-radius: 8px; padding: 0.625rem; font-size: 13px; font-weight: 600; cursor: pointer; }
    #cameraOpenDoor:hover { opacity: 0.9; }

    /* ══════════════════════════════════════════
       DEVICES TREE REDESIGN
    ══════════════════════════════════════════ */

    /* Top action bar */
    .dev-top-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .dev-top-bar h2 { font-family:var(--grg-font-display); font-size:1.25rem; font-weight:600; margin:0; }
    .dev-top-bar-sub { font-size:12px; color:var(--grg-ink-400); margin-top:2px; }
    .dev-top-actions { display:flex; gap:8px; flex-wrap:wrap; }

    /* KPI bar */
    .dev-kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:16px; }
    .dev-kpi { background:var(--grg-glass-base); border:1px solid var(--grg-glass-border); border-radius:10px; padding:12px 16px; backdrop-filter:blur(10px); }
    .dev-kpi .lbl { font-size:11px; color:var(--grg-ink-400); letter-spacing:.8px; text-transform:uppercase; margin-bottom:4px; }
    .dev-kpi .val { font-family:var(--grg-font-display); font-size:1.5rem; font-weight:600; line-height:1; }
    .dev-kpi.ok .val { color:var(--grg-success); }
    .dev-kpi.danger .val { color:var(--grg-danger); }
    .dev-kpi.warn .val { color:var(--grg-warning); }
    @media (max-width:700px) { .dev-kpis { grid-template-columns:repeat(2,1fr); } }

    /* Toolbar */
    .dev-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .dev-search { display:flex; align-items:center; gap:6px; background:var(--grg-glass-base); border:1px solid var(--grg-glass-border); border-radius:8px; padding:6px 10px; flex:1; min-width:180px; backdrop-filter:blur(8px); }
    .dev-search input { background:transparent; border:none; outline:none; color:var(--grg-ink-100); font-size:13px; flex:1; font-family:inherit; }
    .dev-search input::placeholder { color:var(--grg-ink-400); }
    .dev-kbd { background:rgba(138,43,226,.18); color:var(--grg-purple-300); border:1px solid rgba(138,43,226,.3); border-radius:4px; font-size:10px; padding:1px 5px; font-family:var(--grg-font-mono); white-space:nowrap; }
    .dev-filter-chip { display:inline-flex; align-items:center; gap:5px; background:rgba(138,43,226,.14); border:1px solid rgba(138,43,226,.3); color:var(--grg-purple-300); border-radius:99px; padding:3px 10px; font-size:12px; cursor:pointer; }
    .dev-filter-chip .x { opacity:.7; font-size:10px; }
    .dev-filter-chip:hover { background:rgba(138,43,226,.22); }
    .dev-seg { display:flex; background:rgba(14,6,26,.8); border:1px solid var(--grg-glass-border); border-radius:8px; overflow:hidden; }
    .dev-seg button { background:transparent; border:none; color:var(--grg-ink-300); padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; transition:background .15s; }
    .dev-seg button.on { background:rgba(138,43,226,.25); color:#fff; font-weight:600; }
    .dev-seg button:hover:not(.on) { background:rgba(255,255,255,.05); }

    /* Building block */
    .dev-building { margin-bottom:12px; border:1px solid var(--grg-glass-border); border-radius:14px; overflow:hidden; }
    .dev-building-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(14,6,26,.7); cursor:pointer; user-select:none; transition:background .15s; }
    .dev-building-head:hover { background:rgba(138,43,226,.08); }
    .dev-building-chev { color:var(--grg-ink-400); transition:transform .2s; flex-shrink:0; }
    .dev-building-chev.closed { transform:rotate(-90deg); }
    .dev-building-icon { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--grg-primary),#5a4fd6); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
    .dev-building-meta { flex:1; min-width:0; }
    .dev-building-name { font-weight:700; font-size:14px; }
    .dev-building-sub { font-size:11px; color:var(--grg-ink-400); margin-top:1px; }
    .dev-building-stats { display:flex; align-items:center; gap:10px; font-size:12px; flex-shrink:0; }
    .dot-ok { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--grg-success); margin-right:3px; }
    .dot-off { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--grg-danger); margin-right:3px; }
    .dev-building-body { background:rgba(10,4,20,.5); }
    .dev-building-body.collapsed { display:none; }

    /* NVR row */
    .dev-nvr { margin:8px 12px; border:1px solid rgba(138,43,226,.2); border-radius:12px; overflow:hidden; }
    .dev-nvr-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(138,43,226,.06); }
    .dev-nvr-icon { width:36px; height:36px; border-radius:8px; background:rgba(138,43,226,.18); border:1px solid rgba(138,43,226,.3); display:flex; align-items:center; justify-content:center; color:var(--grg-purple-300); flex-shrink:0; font-size:18px; }
    .dev-nvr-meta { flex:1; min-width:0; }
    .dev-nvr-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .dev-nvr-sub { font-size:11px; color:var(--grg-ink-400); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; }
    .dev-nvr-sub .k { color:var(--grg-ink-300); }
    .dev-nvr-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; }

    /* Channel rows */
    .dev-channels { padding:0 0 6px; }
    .dev-ch-header { padding:4px 14px 2px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--grg-ink-300); }
    .dev-ch { display:flex; align-items:center; gap:8px; padding:7px 14px; border-top:1px solid rgba(138,43,226,.1); transition:background .12s; }
    .dev-ch:hover { background:rgba(138,43,226,.04); }
    .dev-ch-num { width:22px; height:22px; border-radius:6px; background:rgba(138,43,226,.18); border:1px solid rgba(138,43,226,.25); display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--grg-font-mono); color:var(--grg-purple-300); flex-shrink:0; }
    .dev-ch-meta { flex:1; min-width:0; }
    .dev-ch-name { font-size:13px; font-weight:500; display:flex; align-items:center; gap:5px; }
    .dev-ch-sub { font-size:11px; color:var(--grg-ink-400); margin-top:1px; }
    .dev-ch-empty { opacity:.55; font-size:12px; color:var(--grg-ink-300); font-style:italic; flex:1; }
    .dev-ch-empty-slot { border-style:dashed !important; border-color:rgba(138,43,226,.18) !important; }
    .dev-ch-actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }

    /* Standalone device rows (IPC/doorphone without NVR parent) */
    .dev-ipc { display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid rgba(138,43,226,.1); transition:background .12s; }
    .dev-ipc:hover { background:rgba(138,43,226,.04); }
    .dev-ipc:first-child { border-top:none; }
    .dev-ipc-icon { width:32px; height:32px; border-radius:8px; background:rgba(138,43,226,.12); border:1px solid rgba(138,43,226,.2); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
    .dev-ipc-meta { flex:1; min-width:0; }
    .dev-ipc-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
    .dev-ipc-sub { font-size:11px; color:var(--grg-ink-400); margin-top:1px; }
    .dev-ipc-actions { display:flex; align-items:center; gap:5px; flex-shrink:0; flex-wrap:wrap; }

    /* Role tags */
    .role-tag { display:inline-block; font-family:var(--grg-font-mono); font-size:9.5px; padding:1px 6px; border-radius:4px; font-weight:700; letter-spacing:.5px; }
    .role-tag.nvr { background:rgba(95,168,255,.15); color:#A7C9FF; border:1px solid rgba(95,168,255,.3); }
    .role-tag.cam { background:rgba(138,43,226,.18); color:var(--grg-purple-300); border:1px solid rgba(138,43,226,.3); }
    .role-tag.dom { background:rgba(246,195,68,.15); color:#F6C344; border:1px solid rgba(246,195,68,.3); }

    /* Status pills */
    .status-pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:99px; font-family:var(--grg-font-mono); white-space:nowrap; }
    .status-pill.ok { background:rgba(61,213,152,.14); color:var(--grg-success); border:1px solid rgba(61,213,152,.25); }
    .status-pill.off { background:rgba(255,107,107,.12); color:var(--grg-danger); border:1px solid rgba(255,107,107,.25); }

    /* Icon-only action buttons */
    button.icon-btn { background:rgba(138,43,226,.1); border:1px solid rgba(138,43,226,.2); color:var(--grg-ink-200); border-radius:7px; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition:background .15s; padding:0; }
    button.icon-btn:hover { background:rgba(138,43,226,.22); color:#fff; }
    button.icon-btn.danger:hover { background:rgba(255,107,107,.2); color:var(--grg-danger); border-color:rgba(255,107,107,.35); }

    /* ⋯ dropdown menu */
    .dev-menu-wrap { position:relative; }
    .dev-menu { position:absolute; right:0; top:calc(100% + 4px); background:rgba(14,6,26,.97); border:1px solid var(--grg-glass-border); border-radius:10px; padding:4px; min-width:160px; z-index:300; box-shadow:0 8px 32px rgba(0,0,0,.5); }
    .dev-menu button { display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:none; color:var(--grg-ink-100); font-size:12.5px; padding:7px 10px; border-radius:7px; cursor:pointer; font-family:inherit; text-align:left; }
    .dev-menu button:hover { background:rgba(138,43,226,.15); }
    .dev-menu button.danger { color:var(--grg-danger); }
    .dev-menu button.danger:hover { background:rgba(255,107,107,.12); }
    .dev-menu hr { border:none; border-top:1px solid var(--grg-glass-border); margin:3px 0; }

    /* Device drawer */
    #deviceDrawer { position:fixed; top:0; right:0; bottom:0; width:360px; background:rgba(10,4,20,.97); border-left:1px solid var(--grg-glass-border); backdrop-filter:blur(20px); z-index:8500; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s cubic-bezier(.4,0,.2,1); box-shadow:-8px 0 40px rgba(0,0,0,.5); }
    #deviceDrawer.open { transform:translateX(0); }
    .drawer-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 0; flex-shrink:0; }
    .drawer-header h3 { margin:0; font-family:var(--grg-font-display); font-size:1rem; display:flex; align-items:center; gap:8px; }
    .drawer-tabs { display:flex; gap:4px; padding:14px 20px 0; flex-shrink:0; }
    .drawer-tab { background:transparent; border:1px solid var(--grg-glass-border); color:var(--grg-ink-300); border-radius:8px; padding:5px 12px; font-size:12px; font-family:inherit; cursor:pointer; transition:all .15s; }
    .drawer-tab.on { background:rgba(138,43,226,.25); border-color:rgba(138,43,226,.5); color:#fff; font-weight:600; }
    .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
    .drawer-field { display:flex; flex-direction:column; gap:4px; }
    .drawer-field label { font-size:11px; color:var(--grg-ink-300); letter-spacing:.5px; }
    .drawer-field input, .drawer-field select { background:rgba(14,6,26,.8); border:1px solid var(--grg-glass-border); color:var(--grg-ink-100); border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; width:100%; }
    .drawer-field input:focus, .drawer-field select:focus { outline:none; border-color:rgba(138,43,226,.6); }
    .drawer-field-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .drawer-hint { background:rgba(95,168,255,.06); border:1px solid rgba(95,168,255,.2); border-radius:10px; padding:10px 12px; }
    .drawer-hint .h-title { font-size:12px; color:#A7C9FF; font-weight:600; display:flex; align-items:center; gap:5px; margin-bottom:4px; }
    .drawer-hint p { font-size:11.5px; color:var(--grg-ink-200); margin:0; line-height:1.45; }
    .drawer-footer { padding:16px 20px; border-top:1px solid var(--grg-glass-border); display:flex; gap:8px; flex-shrink:0; }
    .drawer-footer button { flex:1; }
    #drawerMsgEl { font-size:12px; padding:6px 10px; border-radius:6px; display:none; }
    #drawerMsgEl.ok { background:rgba(61,213,152,.12); color:var(--grg-success); }
    #drawerMsgEl.err { background:rgba(255,107,107,.12); color:var(--grg-danger); }

    body {
      font-family: var(--grg-font-sans);
      color: var(--grg-ink-100);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Typography ── */
    h1, h2, h3 { font-family: var(--grg-font-display); font-weight: 600; }
    code, .badge, .meta-code, pre { font-family: var(--grg-font-mono); }
    a { color: var(--grg-purple-300); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Login overlay (pre-auth) ── */
    .login-overlay {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
    }
    .login-overlay .login-box {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .login-brand h1 {
      font-size: 1.25rem;
      color: var(--grg-purple-300);
      letter-spacing: 0.02em;
    }
    .login-brand .sub {
      font-size: 12px;
      color: var(--grg-ink-300);
      margin-top: 4px;
    }

    /* ── App shell (post-auth) ── */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 224px;
      flex-shrink: 0;
      background: rgba(10, 4, 24, 0.70);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid var(--grg-glass-border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid var(--grg-glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(138,43,226,.4), 0 6px 18px -6px rgba(138,43,226,.6);
    }
    .sidebar-brand .brand-name {
      display: block;
      font-family: var(--grg-font-display);
      font-size: 0.875rem;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .sidebar-brand .brand-sub {
      display: block;
      font-size: 10px;
      color: var(--grg-ink-400);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 0.5rem 0.625rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      background: none;
      border: none;
      border-radius: 9px;
      color: var(--grg-ink-200);
      font-family: var(--grg-font-sans);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background var(--grg-dur-fast) var(--grg-ease), color var(--grg-dur-fast) var(--grg-ease);
    }
    .sidebar-nav-item:hover {
      background: rgba(138, 43, 226, 0.10);
      color: #fff;
    }
    .sidebar-nav-item.active {
      background: rgba(138, 43, 226, 0.20);
      color: #fff;
    }
    .nav-dot {
      width: 6px; height: 6px; border-radius: 99px;
      background: var(--grg-ink-700); flex-shrink: 0;
      transition: background var(--grg-dur-fast), box-shadow var(--grg-dur-fast);
    }
    .sidebar-nav-item.active .nav-dot {
      background: var(--grg-purple-500);
      box-shadow: 0 0 6px var(--grg-purple-500);
    }
    .nav-icon {
      font-size: 13px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 1rem 1rem;
      border-top: 1px solid var(--grg-glass-border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .sidebar-footer .user-role {
      font-size: 11px;
      color: var(--grg-ink-300);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sidebar-footer .sidebar-link {
      font-size: 12px;
      color: var(--grg-ink-300);
    }
    .sidebar-footer .sidebar-link:hover { color: var(--grg-ink-100); }

    /* ── Main area ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.5rem;
      border-bottom: 1px solid var(--grg-glass-border);
      gap: 1rem;
      flex-shrink: 0;
    }
    .main-header .page-title {
      font-family: var(--grg-font-mono);
      font-size: 0.75rem;
      color: var(--grg-ink-300);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .content-area {
      padding: 1.5rem;
      flex: 1;
      overflow-y: auto;
    }

    /* ── Cards ── */
    .card {
      background: var(--grg-glass-base);
      border: 1px solid var(--grg-glass-border);
      border-radius: var(--grg-r-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(var(--grg-blur-md)) saturate(140%);
      -webkit-backdrop-filter: blur(var(--grg-blur-md)) saturate(140%);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute;
      top: 0; left: 16px; right: 16px; height: 1px;
      background: rgba(255, 255, 255, 0.07);
    }
    .card h2 {
      font-family: var(--grg-font-mono);
      font-size: 0.75rem;
      margin: 0 0 1rem 0;
      color: var(--grg-ink-300);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Forms ── */
    form { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 12px;
      color: var(--grg-ink-300);
      font-weight: 500;
    }
    label { font-size: 13px; color: var(--grg-ink-300); }
    input, select, textarea {
      background: rgba(14, 6, 26, 0.80);
      border: 1px solid var(--grg-glass-border);
      color: var(--grg-ink-100);
      padding: 0.5rem 0.75rem;
      border-radius: var(--grg-r-sm);
      font-family: var(--grg-font-sans);
      font-size: 13px;
      transition: border-color var(--grg-dur-fast), box-shadow var(--grg-dur-fast);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--grg-purple-500);
      box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.18);
    }
    input::placeholder { color: var(--grg-ink-400); }
    select option { background: var(--grg-ink-800); }

    /* ── Buttons ── */
    button {
      background: linear-gradient(135deg, var(--grg-purple-500), var(--grg-purple-600));
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--grg-r-sm);
      font-family: var(--grg-font-sans);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 4px 14px -4px rgba(138, 43, 226, 0.60);
      transition: box-shadow var(--grg-dur-fast) var(--grg-ease),
                  background var(--grg-dur-fast) var(--grg-ease);
      white-space: nowrap;
    }
    button:hover {
      background: linear-gradient(135deg, var(--grg-purple-600), var(--grg-purple-700));
      box-shadow: 0 6px 20px -4px rgba(138, 43, 226, 0.75);
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--grg-glass-border);
      color: var(--grg-ink-300);
      box-shadow: none;
    }
    button.secondary:hover { color: #fff; border-color: var(--grg-purple-500); }
    button.danger {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: var(--grg-danger);
      box-shadow: none;
    }
    button.danger:hover { background: rgba(255, 107, 107, 0.25); }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--grg-glass-border);
      color: var(--grg-ink-300);
      box-shadow: none;
      padding: 0.4rem 0.875rem;
      font-size: 12px;
      width: 100%;
    }
    .logout-btn:hover { color: var(--grg-danger); border-color: var(--grg-danger); background: rgba(255,107,107,0.08); }

    /* ── Messages ── */
    .msg { margin-top: 0.75rem; padding: 0.5rem 0.75rem; border-radius: var(--grg-r-sm); font-size: 13px; }
    .msg.err { background: rgba(255, 107, 107, 0.12); color: var(--grg-danger); border: 1px solid rgba(255,107,107,0.25); }
    .msg.ok  { background: rgba(61, 213, 152, 0.12); color: var(--grg-success); border: 1px solid rgba(61,213,152,0.25); }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--grg-glass-border); }
    th { color: var(--grg-ink-300); font-family: var(--grg-font-mono); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    tr:hover td { background: rgba(138, 43, 226, 0.06); }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: var(--grg-r-sm);
      background: rgba(138, 43, 226, 0.15);
      border: 1px solid var(--grg-glass-border);
      color: var(--grg-purple-300);
      font-size: 11px;
      font-family: var(--grg-font-mono);
    }

    /* ── Meta ── */
    .meta { color: var(--grg-ink-300); font-size: 12px; margin-top: 0.5rem; }

    /* ── Health status ── */
    #health { font-size: 13px; color: var(--grg-ink-100); }

    /* ── Utilities ── */
    #userInfo { font-size: 12px; color: var(--grg-ink-300); }

    /* ── Dashboard stat cards (T14/T17) ── */
    .stat-cards { list-style:none; padding:0; display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem; }
    .stat-card { min-width:160px; padding:0.75rem 1rem; background:var(--grg-bg-card); border:1px solid var(--grg-glass-border); border-radius:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
    .stat-card:hover { border-color:var(--grg-purple-500); box-shadow:0 0 0 2px rgba(138,43,226,.15); }
    .stat-label { font-size:11px; color:var(--grg-ink-300); text-transform:uppercase; letter-spacing:.06em; }
    .stat-value { font-size:1.5rem; font-weight:700; color:var(--grg-purple-300); margin-top:4px; }

    /* ── Scan channel panel (T17) ── */
    .scan-ch-panel { margin:8px 0; border:1px solid var(--grg-glass-border); border-radius:8px; overflow:hidden; }
    .scan-result-header { padding:10px 14px; background:rgba(138,43,226,.25); font-size:11px; font-weight:600; color:#fff; }
    .scan-result-row { display:flex; align-items:center; gap:12px; padding:7px 14px; border-top:1px solid var(--grg-glass-border); font-size:12px; }
  </style>
</head>
<body class="grg-bg">

  <!-- ══ PRE-AUTH: login overlay ══ -->
  <div id="loginContainer" class="login-overlay">
    <div class="login-box">
      <div class="login-brand">
        <h1>Doorphone</h1>
        <p class="sub">Панель управления</p>
      </div>

      <div class="card">
        <h2>Состояние сервера</h2>
        <div id="health">Загрузка…</div>
        <div class="meta">GET /api/health</div>
      </div>

      <div class="card" id="authSection">
        <h2>Вход</h2>
        <form id="loginForm" style="flex-direction:column; align-items:stretch;">
          <div class="field">
            <label for="login">Логин (email или телефон)</label>
            <input type="text" id="login" name="login" placeholder="admin@example.com" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••" required autocomplete="current-password">
          </div>
          <button type="submit" style="margin-top:0.25rem;">Войти</button>
        </form>
        <div id="loginMsg" class="msg" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ══ POST-AUTH: sidebar shell ══ -->
  <div id="appShell" class="app-shell" style="display:none;">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="brand-logo" src="/work.png" alt="GRG">
        <div>
          <span class="brand-name">Doorphone</span>
          <span class="brand-sub">Admin</span>
        </div>
      </div>

      <!-- Tab nav rendered by buildTabsByRole() -->
      <nav id="tabBar" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <span class="user-role" id="userInfo"></span>
        <a href="/docs" target="_blank" class="sidebar-link">Swagger API</a>
        <a href="/api/docs/TUTORIAL.md" target="_blank" class="sidebar-link">📖 Туториал</a>
        <button type="button" id="logoutBtn" class="logout-btn">Выйти</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="main-header">
        <span class="page-title" id="pageTitle">Панель управления</span>
        <div class="header-actions">
          <span id="roleHint" class="meta"></span>
        </div>
      </header>

      <div class="content-area" id="dataSection">
        <div id="dataContent">Выберите раздел</div>

        <div id="createSection" class="card" style="margin-top:1rem; display:none;">
          <h2 id="createSectionTitle">Создать</h2>
          <div id="createFormContainer"></div>
          <div id="createMsg" class="msg" style="display:none;"></div>
        </div>


        <section id="residentSection" class="card" style="margin-top:1rem; display:none;">
          <h2>Жители квартиры</h2>
          <p class="meta">Квартира: <span id="residentApartmentName">—</span></p>
          <div id="residentsList" style="margin-top:0.75rem;">Загрузка…</div>
          <form id="addResidentForm" style="margin-top:1rem;">
            <label for="resUserId">ID пользователя (или оставьте пустым)</label>
            <input type="text" id="resUserId" placeholder="UUID или пусто" style="width:200px;">
            <input type="text" id="resEmail" placeholder="Email">
            <input type="text" id="resPhone" placeholder="Телефон">
            <input type="text" id="resRole" placeholder="роль: owner/resident/guest" value="resident" style="width:140px;">
            <button type="submit">Добавить жителя</button>
          </form>
          <div id="addResidentMsg" class="msg" style="display:none;"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- Device Drawer -->
  <aside id="deviceDrawer">
    <div class="drawer-header">
      <h3 id="drawerTitle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--grg-purple-300)" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Добавить устройство
      </h3>
      <button class="icon-btn" id="drawerCloseBtn" title="Закрыть">✕</button>
    </div>
    <div class="drawer-tabs" id="drawerTabs">
      <button class="drawer-tab on" data-dtype="UNIVIEW_NVR" data-drole="NVR">NVR</button>
      <button class="drawer-tab" data-dtype="UNIVIEW_IPC" data-drole="CAMERA">Камера</button>
      <button class="drawer-tab" data-dtype="UNIVIEW_IPC" data-drole="DOORPHONE">Домофон</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      <div id="drawerMsgEl"></div>
      <button class="secondary" id="drawerTestBtn">🔌 Проверить</button>
      <button class="primary" id="drawerSaveBtn">Добавить</button>
    </div>
  </aside>
  <div id="deviceDrawerOverlay" style="display:none;position:fixed;inset:0;z-index:8499;background:rgba(0,0,0,0.4);" onclick="closeDeviceDrawer()"></div>

  <div id="cameraModal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this)closeCameraModal()">
    <div class="modal-box" style="max-width:640px;width:100%;gap:0.75rem;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="modal-title" id="cameraModalTitle"></div>
          <div style="font-size:12px;color:var(--grg-ink-400);margin-top:2px;" id="cameraModalSubtitle"></div>
        </div>
        <button type="button" id="cameraModalClose" class="secondary" style="padding:0.25rem 0.5rem;font-size:16px;line-height:1;">✕</button>
      </div>
      <div style="position:relative;">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <div id="cameraLoading"><span style="color:var(--grg-ink-400);font-size:13px;">⏳ Подключение...</span></div>
        <div id="cameraLiveBadge" style="display:none;">● LIVE</div>
      </div>
      <div id="cameraError" style="display:none;color:var(--grg-danger);font-size:13px;text-align:center;padding:0.5rem;"></div>
      <button type="button" id="cameraOpenDoor" style="display:none;">🔓 Открыть дверь</button>
    </div>
  </div>
  <div id="toastContainer"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
