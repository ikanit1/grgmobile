name: 🔍 Автоматический аудит кода

on:
  push:
  pull_request:

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Determine changed files ────────────────────────────────────────────
      - name: Get changed files
        id: changes
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Handle first push to a new branch (before is all-zeros)
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --stat --format="" HEAD | grep -v "^$" | awk '{print $1}')
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          fi

          printf "%s\n" "$CHANGED" > /tmp/changed_files.txt
          echo "Total changed files: $(wc -l < /tmp/changed_files.txt)"
          cat /tmp/changed_files.txt

      # ── Audit logic ───────────────────────────────────────────────────────
      - name: Run audit
        run: |
          CHANGED=$(cat /tmp/changed_files.txt)
          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          DATE=$(date '+%Y-%m-%d %H:%M UTC')

          REPORT="🔍 *Автоматический аудит кода*"
          REPORT="$REPORT\n📦 Репо: \`$REPO\`"
          REPORT="$REPORT\n🌿 Ветка: \`$BRANCH\`"
          REPORT="$REPORT\n👤 Автор: \`$ACTOR\`"
          REPORT="$REPORT\n📅 $DATE"
          REPORT="$REPORT\n📋 Событие: \`$EVENT\`"

          if [ "$EVENT" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            REPORT="$REPORT\n🔀 PR: \`$PR_TITLE\`"
          fi

          REPORT="$REPORT\n━━━━━━━━━━━━━━━━━"

          CRITICAL=""
          WARNINGS=""

          # ── Backend (NestJS) ────────────────────────────────
          BACKEND=$(echo "$CHANGED" | grep "^backend/" || true)
          if [ -n "$BACKEND" ]; then
            B_COUNT=$(echo "$BACKEND" | grep -c "." || true)
            REPORT="$REPORT\n\n🗄 *Backend (NestJS):* $B_COUNT файл(ов)"

            # Migrations
            MIGRATIONS=$(echo "$BACKEND" | grep -iE "migration|\.sql$|migrate" || true)
            if [ -n "$MIGRATIONS" ]; then
              M_COUNT=$(echo "$MIGRATIONS" | grep -c "." || true)
              REPORT="$REPORT\n  🔄 Миграции: $M_COUNT"
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                if grep -qiE "DROP TABLE|DROP COLUMN|TRUNCATE" "$f" 2>/dev/null; then
                  CRITICAL="$CRITICAL\n🚨 Деструктивная операция в \`$(basename "$f")\` (DROP/TRUNCATE)"
                fi
                if grep -qiE "CREATE TABLE|ALTER TABLE|ADD COLUMN" "$f" 2>/dev/null; then
                  if ! grep -qiE "down\(\)|revert|rollback" "$f" 2>/dev/null; then
                    WARNINGS="$WARNINGS\n⚡ Нет метода rollback в \`$(basename "$f")\`"
                  fi
                fi
              done <<< "$MIGRATIONS"
            fi

            # TypeORM entities
            ENTITIES=$(echo "$BACKEND" | grep "\.entity\.ts$" || true)
            if [ -n "$ENTITIES" ]; then
              E_COUNT=$(echo "$ENTITIES" | grep -c "." || true)
              REPORT="$REPORT\n  🏗 Entity (схема БД): $E_COUNT"
              WARNINGS="$WARNINGS\n⚡ Изменены entity — проверьте TypeORM synchronize"
            fi

            # Controllers
            CTRLS=$(echo "$BACKEND" | grep "\.controller\.ts$" || true)
            if [ -n "$CTRLS" ]; then
              C_COUNT=$(echo "$CTRLS" | grep -c "." || true)
              REPORT="$REPORT\n  🔌 Контроллеры: $C_COUNT"
            fi

            # Modules
            MODS=$(echo "$BACKEND" | grep "\.module\.ts$" || true)
            if [ -n "$MODS" ]; then
              MOD_COUNT=$(echo "$MODS" | grep -c "." || true)
              REPORT="$REPORT\n  📦 Модули: $MOD_COUNT"
            fi

            # Services — check module registration
            SVCS=$(echo "$BACKEND" | grep "\.service\.ts$" || true)
            if [ -n "$SVCS" ]; then
              SVC_COUNT=$(echo "$SVCS" | grep -c "." || true)
              REPORT="$REPORT\n  ⚙️ Сервисы: $SVC_COUNT"
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                SVCNAME=$(basename "$f" .service.ts)
                DIR=$(dirname "$f")
                if [ ! -f "$DIR/${SVCNAME}.module.ts" ]; then
                  WARNINGS="$WARNINGS\n⚡ Нет модуля для \`$(basename "$f")\` — проверьте регистрацию"
                fi
              done <<< "$SVCS"
            fi

            # Credentials / secrets hardcode check
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              if grep -qE "password\s*[:=]\s*['\"][^'\"]{4,}" "$f" 2>/dev/null; then
                CRITICAL="$CRITICAL\n🚨 Возможные hardcoded credentials в \`$(basename "$f")\`"
              fi
            done <<< "$BACKEND"

            # Streaming endpoints (go2rtc / RTSP / live-url)
            STREAM=$(echo "$BACKEND" | grep -iE "stream|rtc|live|rtsp|video" || true)
            if [ -n "$STREAM" ]; then
              STR_COUNT=$(echo "$STREAM" | grep -c "." || true)
              REPORT="$REPORT\n  🎥 Стриминг-файлы: $STR_COUNT"
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                HAS_TRY=$(grep -c "try {" "$f" 2>/dev/null || echo 0)
                HAS_CATCH=$(grep -c "} catch" "$f" 2>/dev/null || echo 0)
                HAS_LOG=$(grep -cE "logger\.|Logger\." "$f" 2>/dev/null || echo 0)
                NAME=$(basename "$f")
                if [ "$HAS_TRY" -gt 0 ] && [ "$HAS_CATCH" -gt 0 ]; then
                  REPORT="$REPORT\n    ✅ \`$NAME\` — try/catch есть"
                  if [ "$HAS_LOG" -eq 0 ]; then
                    WARNINGS="$WARNINGS\n⚡ Нет логирования в стриминг-файле \`$NAME\`"
                  fi
                else
                  CRITICAL="$CRITICAL\n🚨 Нет try/catch в стриминг-эндпоинте \`$NAME\`"
                fi
              done <<< "$STREAM"
            fi
          fi

          # ── Flutter ─────────────────────────────────────────
          FLUTTER=$(echo "$CHANGED" | grep -E "^lib/|^pubspec\." || true)
          if [ -n "$FLUTTER" ]; then
            F_COUNT=$(echo "$FLUTTER" | grep -c "." || true)
            REPORT="$REPORT\n\n📱 *Flutter:* $F_COUNT файл(ов)"

            if echo "$FLUTTER" | grep -q "pubspec"; then
              REPORT="$REPORT\n  📦 pubspec обновлён — нужен \`flutter pub get\`"
            fi

            SCREENS=$(echo "$FLUTTER" | grep "^lib/screens/" || true)
            if [ -n "$SCREENS" ]; then
              SC_COUNT=$(echo "$SCREENS" | grep -c "." || true)
              REPORT="$REPORT\n  🖥 Экраны: $SC_COUNT"
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                ASYNC_C=$(grep -cE "async|Future<" "$f" 2>/dev/null || echo 0)
                CATCH_C=$(grep -c "catch (" "$f" 2>/dev/null || echo 0)
                if [ "$ASYNC_C" -gt 3 ] && [ "$CATCH_C" -eq 0 ]; then
                  WARNINGS="$WARNINGS\n⚡ Нет catch для async в \`$(basename "$f")\`"
                fi
              done <<< "$SCREENS"
            fi

            API_FILES=$(echo "$FLUTTER" | grep "^lib/api/" || true)
            [ -n "$API_FILES" ] && REPORT="$REPORT\n  🔌 API-клиент: изменён"

            SVC_FILES=$(echo "$FLUTTER" | grep "^lib/services/" || true)
            if [ -n "$SVC_FILES" ]; then
              SV_COUNT=$(echo "$SVC_FILES" | grep -c "." || true)
              REPORT="$REPORT\n  ⚙️ Сервисы: $SV_COUNT"
            fi

            MODEL_FILES=$(echo "$FLUTTER" | grep "^lib/models/" || true)
            [ -n "$MODEL_FILES" ] && REPORT="$REPORT\n  📊 Модели данных: изменены"

            WIDGET_FILES=$(echo "$FLUTTER" | grep "^lib/widgets/" || true)
            [ -n "$WIDGET_FILES" ] && REPORT="$REPORT\n  🧩 Виджеты: изменены"
          fi

          # ── Config / CI changes ──────────────────────────────
          CI_FILES=$(echo "$CHANGED" | grep -E "^\.github/|docker-compose|\.env" || true)
          if [ -n "$CI_FILES" ]; then
            CI_COUNT=$(echo "$CI_FILES" | grep -c "." || true)
            REPORT="$REPORT\n\n⚙️ *Инфраструктура:* $CI_COUNT файл(ов)"
            if echo "$CI_FILES" | grep -q "\.env"; then
              CRITICAL="$CRITICAL\n🚨 Изменён .env-файл — проверьте, нет ли секретов в коммите"
            fi
          fi

          # ── Summary ─────────────────────────────────────────
          REPORT="$REPORT\n\n━━━━━━━━━━━━━━━━━"

          if [ -n "$CRITICAL" ]; then
            REPORT="$REPORT\n\n🚨 *КРИТИЧЕСКИЕ ПРОБЛЕМЫ:*$CRITICAL"
            STATUS="❌ ТРЕБУЕТ ВНИМАНИЯ"
          elif [ -n "$WARNINGS" ]; then
            REPORT="$REPORT\n\n⚠️ *Предупреждения:*$WARNINGS"
            STATUS="⚠️ ЕСТЬ ЗАМЕЧАНИЯ"
          else
            STATUS="✅ ВСЁ В ПОРЯДКЕ"
          fi

          if [ -z "$BACKEND" ] && [ -z "$FLUTTER" ] && [ -z "$CI_FILES" ]; then
            REPORT="$REPORT\n\nℹ️ Изменены вспомогательные файлы (docs, assets и т.д.)"
            STATUS="ℹ️ НЕТ ЗНАЧИМЫХ ИЗМЕНЕНИЙ"
          fi

          REPORT="$REPORT\n\n🏆 *Итог: $STATUS*"
          REPORT="$REPORT\n🔗 Коммит: https://github.com/$REPO/commit/$SHA"

          printf "%b" "$REPORT" > /tmp/audit_report.txt
          echo "=== AUDIT REPORT ==="
          cat /tmp/audit_report.txt

      # ── Send to Telegram ──────────────────────────────────────────────────
      - name: Send Telegram report
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys

          TELEGRAM_TOKEN = "8578442151:AAGyycIa1TyBCrMp78QLNS2GCscB8Kph6Rc"
          CHAT_ID        = "947126451"

          with open("/tmp/audit_report.txt", "r") as fh:
              text = fh.read().strip()

          if not text:
              text = "⚠️ Аудит завершён, но отчёт пуст."

          payload = json.dumps({
              "chat_id": CHAT_ID,
              "text": text,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"}
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              result = json.loads(resp.read().decode())
              if result.get("ok"):
                  print("✅ Telegram report sent successfully")
              else:
                  print(f"❌ Telegram API error: {result}", file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f"❌ Failed to send Telegram message: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
