name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          DB_TYPE: sqlite
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-not-for-production
          CREDENTIALS_ENCRYPTION_KEY: 00000000000000000000000000000000
          WEBHOOK_SECRET: ci-test-webhook-secret
