name: Code Audit & Telegram Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Determine what changed ──────────────────────────────────────────────
      - name: Detect changed areas
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id -r --name-only HEAD)
          else
            FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null \
                    || git diff-tree --no-commit-id -r --name-only HEAD)
          fi

          echo "files<<EOF"  >> "$GITHUB_OUTPUT"
          echo "$FILES"       >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"

          echo "backend=$(echo "$FILES" | grep -q '^backend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(echo "$FILES" | grep -qE '^(lib|test|pubspec)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ── Backend: TypeScript + migration/entity/go2rtc analysis ─────────────
      - name: Setup Node.js
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend audit
        if: steps.changes.outputs.backend == 'true'
        id: backend_audit
        working-directory: backend
        env:
          DB_TYPE: sqlite
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          CREDENTIALS_ENCRYPTION_KEY: 00000000000000000000000000000000
          WEBHOOK_SECRET: ci-test-webhook-secret
        run: |
          npm ci --prefer-offline 2>&1 | tail -3

          # TypeScript compile check
          TSC_STATUS="✅ OK"
          TSC_DETAIL=""
          if ! npx tsc --noEmit 2>/tmp/tsc.txt; then
            TSC_STATUS="❌ Ошибки компиляции"
            TSC_DETAIL=$(head -20 /tmp/tsc.txt | sed 's/"/\\"/g')
          fi

          # Migration / entity changes
          CHANGED="${{ steps.changes.outputs.files }}"
          MIGRATIONS=$(echo "$CHANGED" | grep -E '(migration|migrate|\.sql)$' | head -5 || true)
          ENTITIES=$(echo "$CHANGED"   | grep -E '\.entity\.ts$'              | head -5 || true)

          MIG_NOTE=""
          [ -n "$MIGRATIONS" ] && MIG_NOTE="Файлы миграций: $(echo $MIGRATIONS | tr '\n' ' ')"
          [ -n "$ENTITIES"   ] && MIG_NOTE="$MIG_NOTE | Entities: $(echo $ENTITIES | tr '\n' ' ')"

          # go2rtc / streaming error-handling check
          STREAM_FILES=$(echo "$CHANGED" | grep '^backend/' \
            | while read f; do
                [ -f "../$f" ] && grep -lE 'go2rtc|liveUrl|rtspUrl|hls' "../$f" 2>/dev/null
              done || true)
          GO2RTC_WARN=""
          for f in $STREAM_FILES; do
            if ! grep -qE 'try\s*{|catch\s*\(|HttpException|handleError' "$f" 2>/dev/null; then
              GO2RTC_WARN="$GO2RTC_WARN⚠️ Нет try/catch в ${f##../backend/}\n"
            fi
          done

          {
            echo "tsc_status=$TSC_STATUS"
            echo "tsc_detail<<EOF"
            echo "$TSC_DETAIL"
            echo "EOF"
            echo "mig_note=$MIG_NOTE"
            echo "go2rtc_warn<<EOF"
            printf "%b" "$GO2RTC_WARN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Flutter: analyze + structure notes ─────────────────────────────────
      - name: Setup Flutter
        if: steps.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter audit
        if: steps.changes.outputs.flutter == 'true'
        id: flutter_audit
        run: |
          flutter pub get 2>&1 | tail -3

          AZ_STATUS="✅ OK"
          AZ_DETAIL=""
          if ! flutter analyze --no-pub 2>/tmp/flutter.txt; then
            AZ_STATUS="⚠️ Предупреждения/ошибки"
            AZ_DETAIL=$(grep -E '(error|warning)' /tmp/flutter.txt | head -15 | sed 's/"/\\"/g' || true)
          fi

          CHANGED="${{ steps.changes.outputs.files }}"
          STRUCT=""
          echo "$CHANGED" | grep -qE '^lib/screens/'  && STRUCT="$STRUCT screens"
          echo "$CHANGED" | grep -qE '^lib/widgets/'  && STRUCT="$STRUCT widgets"
          echo "$CHANGED" | grep -qE '^lib/api/'      && STRUCT="$STRUCT api-clients"
          echo "$CHANGED" | grep -qE '^lib/models/'   && STRUCT="$STRUCT models"
          echo "$CHANGED" | grep -qE '^lib/services/' && STRUCT="$STRUCT services"

          {
            echo "az_status=$AZ_STATUS"
            echo "az_detail<<EOF"
            echo "$AZ_DETAIL"
            echo "EOF"
            echo "struct=$(echo $STRUCT | xargs)"
          } >> "$GITHUB_OUTPUT"

      # ── Build report and send to Telegram ──────────────────────────────────
      - name: Send Telegram report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME:    ${{ github.event_name }}
          ACTOR:         ${{ github.actor }}
          REPO:          ${{ github.repository }}
          SHA:           ${{ github.sha }}
          REF:           ${{ github.ref_name }}
          PR_NUM:        ${{ github.event.pull_request.number }}
          PR_TITLE:      ${{ github.event.pull_request.title }}
          AREA_BACKEND:  ${{ steps.changes.outputs.backend }}
          AREA_FLUTTER:  ${{ steps.changes.outputs.flutter }}
          TSC_STATUS:    ${{ steps.backend_audit.outputs.tsc_status }}
          TSC_DETAIL:    ${{ steps.backend_audit.outputs.tsc_detail }}
          MIG_NOTE:      ${{ steps.backend_audit.outputs.mig_note }}
          GO2RTC_WARN:   ${{ steps.backend_audit.outputs.go2rtc_warn }}
          AZ_STATUS:     ${{ steps.flutter_audit.outputs.az_status }}
          AZ_DETAIL:     ${{ steps.flutter_audit.outputs.az_detail }}
          FLUTTER_STRUCT: ${{ steps.flutter_audit.outputs.struct }}
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, json, sys

          def env(k, default=""):
              return os.environ.get(k, default).strip()

          # ── Event header ──
          event = env("EVENT_NAME")
          if event == "pull_request":
              header = f"PR #{env('PR_NUM')}: {env('PR_TITLE')}"
          else:
              sha = env("SHA")[:7]
              header = f"push → {env('REF')} | {sha}"

          lines = [
              "🔍 *Аудит изменений — GRG Mobile*",
              "",
              f"📌 {header}",
              f"👤 Автор: {env('ACTOR')}",
          ]

          # ── Backend section ──
          if env("AREA_BACKEND") == "true":
              lines += ["", "🔧 *NestJS Backend*"]
              lines.append(f"TypeScript: {env('TSC_STATUS')}")
              if detail := env("TSC_DETAIL"):
                  lines.append(f"```\n{detail[:400]}\n```")
              if mig := env("MIG_NOTE"):
                  lines.append(f"📋 {mig}")
              if warn := env("GO2RTC_WARN"):
                  lines.append(f"🎥 go2rtc:\n{warn}")

          # ── Flutter section ──
          if env("AREA_FLUTTER") == "true":
              lines += ["", "📱 *Flutter*"]
              lines.append(f"Analyze: {env('AZ_STATUS')}")
              if detail := env("AZ_DETAIL"):
                  lines.append(f"```\n{detail[:400]}\n```")
              if struct := env("FLUTTER_STRUCT"):
                  lines.append(f"Затронутые слои: {struct}")

          # ── Overall verdict ──
          has_errors = (
              "❌" in env("TSC_STATUS") or
              "⚠️" in env("AZ_STATUS") or
              bool(env("GO2RTC_WARN"))
          )
          verdict = "❌ Требует внимания" if has_errors else "✅ Всё в порядке"
          lines += ["", f"🏁 *Итог:* {verdict}"]
          lines.append(f"🔗 https://github.com/{env('REPO')}/commit/{env('SHA')}")

          text = "\n".join(lines)

          token = env("TELEGRAM_TOKEN")
          chat_id = env("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret not set", file=sys.stderr)
              sys.exit(1)

          payload = json.dumps({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True,
          }).encode()

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              print("Telegram report sent, status:", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Telegram HTTP error {e.code}: {body}", file=sys.stderr)
              sys.exit(1)
          PYEOF
