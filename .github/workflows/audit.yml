name: Auto Code Audit

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── DETECT CHANGED FILES ─────────────────────────────────────
      - name: Detect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            else
              CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")
            fi
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"   >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"

          echo "has_backend=$(echo "$CHANGED"  | grep -q  '^backend/'                        && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_flutter=$(echo "$CHANGED"  | grep -qE '^lib/|^pubspec'                   && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_streaming=$(echo "$CHANGED" | grep -qE 'go2rtc|live[-_]url|rtsp[-_]|stream[-_](url|service|controller)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "file_count=$(echo "$CHANGED"   | grep -c '[^[:space:]]' || echo 0)"         >> "$GITHUB_OUTPUT"

          # Last commit message (safe single line)
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' | head -c 120 | tr '\n"' "  ")
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      # ─── BACKEND AUDIT ────────────────────────────────────────────
      - name: Audit backend (NestJS / PostgreSQL)
        if: steps.changed.outputs.has_backend == 'true'
        id: backend_audit
        run: |
          ISSUES=""
          FILES="${{ steps.changed.outputs.files }}"

          MIGRATION_FILES=$(echo "$FILES" | grep -E 'migration|Migration|\.sql' || true)
          ENTITY_FILES=$(echo "$FILES"    | grep 'entity\.ts'                   || true)
          MODULE_FILES=$(echo "$FILES"    | grep 'module\.ts'                   || true)

          # Destructive SQL
          for f in $MIGRATION_FILES; do
            [ -f "$f" ] || continue
            if grep -qiE 'DROP TABLE|DROP COLUMN' "$f"; then
              ISSUES="$ISSUES\n🔴 КРИТИЧНО: деструктивная операция (DROP) в $f"
            fi
            if grep -qi 'NOT NULL' "$f" && ! grep -qiE 'DEFAULT|DROP NOT NULL' "$f"; then
              ISSUES="$ISSUES\n⚠️ $f: NOT NULL без DEFAULT — риск для существующих строк"
            fi
          done

          # Module registers entities via forFeature?
          for m in $MODULE_FILES; do
            [ -f "$m" ] || continue
            if grep -q 'TypeOrmModule' "$m" && ! grep -q 'forFeature' "$m"; then
              ISSUES="$ISSUES\n⚠️ $m: TypeOrmModule без forFeature — сущность не зарегистрирована"
            fi
          done

          # Credentials stored as plain text
          for f in $(echo "$FILES" | grep '\.ts$' || true); do
            [ -f "$f" ] || continue
            if grep -qiE "password\s*[:=]\s*['\"][^'\"]{4}" "$f" && \
               ! grep -qiE 'hashSync|bcrypt|encrypt|CredentialsService' "$f"; then
              ISSUES="$ISSUES\n🔴 КРИТИЧНО: $f — возможно хранение пароля открытым текстом"
            fi
          done

          # Access control: controllers without @Req()
          for f in $(echo "$FILES" | grep 'controller\.ts$' || true); do
            [ -f "$f" ] || continue
            if grep -qiE '@Get|@Post|@Put|@Delete|@Patch' "$f" && \
               ! grep -qE '@Req\(\)|accessService|findAllForUser|findByIdForUser' "$f"; then
              ISSUES="$ISSUES\n⚠️ $f: эндпоинты без явного AccessService/findForUser"
            fi
          done

          [ -z "$ISSUES" ] && ISSUES="\n✅ Критических проблем не найдено"

          SUMMARY="*Бэкенд (NestJS / PostgreSQL)*"
          [ -n "$MIGRATION_FILES" ] && SUMMARY="$SUMMARY\n📋 Миграции: $(echo $MIGRATION_FILES | tr '\n' ' ')"
          [ -n "$ENTITY_FILES"    ] && SUMMARY="$SUMMARY\n📦 Сущности: $(echo $ENTITY_FILES | tr '\n' ' ')"
          [ -n "$MODULE_FILES"    ] && SUMMARY="$SUMMARY\n🔧 Модули:   $(echo $MODULE_FILES | tr '\n' ' ')"
          SUMMARY="$SUMMARY$ISSUES"

          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ─── FLUTTER AUDIT ────────────────────────────────────────────
      - name: Audit Flutter (UI structure)
        if: steps.changed.outputs.has_flutter == 'true'
        id: flutter_audit
        run: |
          ISSUES=""
          FILES="${{ steps.changed.outputs.files }}"

          # Screen files outside lib/screens/
          MISPLACED_S=$(echo "$FILES" | grep -E 'screen\.dart$' | grep -v '^lib/screens/' || true)
          [ -n "$MISPLACED_S" ] && ISSUES="$ISSUES\n⚠️ Screen-файлы вне lib/screens/:\n  $MISPLACED_S"

          # Widget files outside lib/widgets/
          MISPLACED_W=$(echo "$FILES" | grep -E 'widget\.dart$' | grep -v '^lib/widgets/' || true)
          [ -n "$MISPLACED_W" ] && ISSUES="$ISSUES\n⚠️ Widget-файлы вне lib/widgets/:\n  $MISPLACED_W"

          # Models outside lib/models/
          MISPLACED_M=$(echo "$FILES" | grep -E 'model\.dart$' | grep -v '^lib/models/' || true)
          [ -n "$MISPLACED_M" ] && ISSUES="$ISSUES\n⚠️ Model-файлы вне lib/models/:\n  $MISPLACED_M"

          # pubspec changes
          echo "$FILES" | grep -q 'pubspec.yaml' && \
            ISSUES="$ISSUES\n📦 pubspec.yaml изменён — проверить совместимость зависимостей"

          # BackendClient без проверки авторизации
          for f in $(echo "$FILES" | grep '\.dart$' || true); do
            [ -f "$f" ] || continue
            if grep -q 'BackendClient' "$f" && \
               ! grep -qE 'getUser\(\)|isLoggedIn|authToken|AuthStorage' "$f"; then
              ISSUES="$ISSUES\n⚠️ $f: BackendClient без проверки авторизации"
            fi
          done

          [ -z "$ISSUES" ] && ISSUES="\n✅ Структура соответствует архитектуре проекта"

          SUMMARY="*Flutter (UI компоненты)*$ISSUES"

          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ─── STREAMING AUDIT ──────────────────────────────────────────
      - name: Audit streaming endpoints (go2rtc / RTSP)
        if: steps.changed.outputs.has_streaming == 'true'
        id: streaming_audit
        run: |
          ISSUES=""
          FILES="${{ steps.changed.outputs.files }}"

          STREAM_FILES=$(echo "$FILES" | \
            grep -E 'go2rtc|live[-_]url|rtsp[-_]|stream[-_](url|service|controller)' | \
            grep -E '\.(ts|dart)$' || true)

          for f in $STREAM_FILES; do
            [ -f "$f" ] || continue

            # try/catch?
            if ! grep -qE 'try\s*\{|catch\s*\(|catch\s*:|\\.catchError|on\s+Exception' "$f"; then
              ISSUES="$ISSUES\n🔴 $f: отсутствует обработка исключений (try/catch)"
            fi

            # timeout?
            if grep -qiE 'http\.|HttpClient|dio\.|fetch\(' "$f" && \
               ! grep -qi 'timeout' "$f"; then
              ISSUES="$ISSUES\n⚠️ $f: не задан timeout для HTTP-запросов"
            fi

            # UI error state (Dart)?
            if [[ "$f" == *.dart ]] && \
               ! grep -qiE 'ErrorWidget|showSnackBar|onError|errorMessage|_error' "$f"; then
              ISSUES="$ISSUES\n⚠️ $f: отсутствует отображение ошибки в UI"
            fi

            # Auth check for live-url endpoints (NestJS)?
            if [[ "$f" == *.ts ]] && grep -qi 'live.url\|liveUrl' "$f" && \
               ! grep -qE '@UseGuards|JwtAuthGuard' "$f"; then
              ISSUES="$ISSUES\n🔴 $f: эндпоинт live-url без JWT-защиты (@UseGuards)"
            fi
          done

          [ -z "$STREAM_FILES" ] && ISSUES="\n⏭️ Файлы стриминга не затронуты"
          [ -z "$ISSUES" ]       && ISSUES="\n✅ Обработка ошибок реализована корректно"

          SUMMARY="*Стриминг (go2rtc / RTSP)*$ISSUES"

          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ─── SEND TELEGRAM REPORT ─────────────────────────────────────
      - name: Send report to Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EVENT="${{ github.event_name }}"
          ACTOR="${{ github.actor }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          COMMIT_MSG="${{ steps.changed.outputs.commit_msg }}"
          FILE_COUNT="${{ steps.changed.outputs.file_count }}"

          if [ "$EVENT" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            EVENT_LINE="🔀 PR #${PR_NUM}: ${PR_TITLE}"
          else
            EVENT_LINE="🚀 Push → ${BRANCH}"
          fi

          B_REPORT="${{ steps.backend_audit.outputs.report }}"
          F_REPORT="${{ steps.flutter_audit.outputs.report }}"
          S_REPORT="${{ steps.streaming_audit.outputs.report }}"

          [ -z "$B_REPORT" ] && B_REPORT="*Бэкенд (NestJS / PostgreSQL)*\n⏭️ Файлы не затронуты"
          [ -z "$F_REPORT" ] && F_REPORT="*Flutter (UI компоненты)*\n⏭️ Файлы не затронуты"
          [ -z "$S_REPORT" ] && S_REPORT="*Стриминг (go2rtc / RTSP)*\n⏭️ Файлы не затронуты"

          MSG=$(printf '%b' "🤖 *Автоматический аудит — GRG Mobile*

${EVENT_LINE}
👤 Автор: ${ACTOR}
🔖 Коммит: \`${SHORT_SHA}\` — ${COMMIT_MSG}
📁 Репозиторий: ${REPO}
📂 Изменено файлов: ${FILE_COUNT}

━━━━━━━━━━━━━━━━
${B_REPORT}

━━━━━━━━━━━━━━━━
${F_REPORT}

━━━━━━━━━━━━━━━━
${S_REPORT}
━━━━━━━━━━━━━━━━
🕒 $(date -u '+%Y-%m-%d %H:%M UTC')")

          # Use jq for safe JSON encoding
          PAYLOAD=$(jq -n \
            --arg chat  "$TG_CHAT" \
            --arg text  "$MSG" \
            '{chat_id: $chat, text: $text, parse_mode: "Markdown", disable_web_page_preview: true}')

          HTTP_STATUS=$(curl -s -o /tmp/tg_resp.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Telegram API error (HTTP $HTTP_STATUS):"
            cat /tmp/tg_resp.json
            exit 1
          fi

          echo "Telegram report sent successfully (HTTP $HTTP_STATUS)"
