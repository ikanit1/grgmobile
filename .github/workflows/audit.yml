name: Automated Code Audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  audit:
    name: audit-and-notify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # On first push (before is all zeros) compare with parent
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id -r --name-only "$HEAD" 2>/dev/null || echo "")
          else
            FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")
          fi

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Category flags
          echo "has_backend=$(echo "$FILES" | grep -c '^backend/' || true)" >> $GITHUB_OUTPUT
          echo "has_flutter=$(echo "$FILES" | grep -cE '^(lib/|test/|pubspec)' || true)" >> $GITHUB_OUTPUT
          echo "has_migrations=$(echo "$FILES" | grep -cE '(migration|\.sql|entity\.ts)' || true)" >> $GITHUB_OUTPUT
          echo "has_go2rtc=$(echo "$FILES" | grep -c 'go2rtc' || true)" >> $GITHUB_OUTPUT
          echo "has_control=$(echo "$FILES" | grep -c 'control/' || true)" >> $GITHUB_OUTPUT
          echo "has_vendors=$(echo "$FILES" | grep -c 'vendors/' || true)" >> $GITHUB_OUTPUT

      # ─── Backend audit ──────────────────────────────────────────────────────
      - name: Setup Node.js (backend audit)
        if: steps.changed.outputs.has_backend != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        if: steps.changed.outputs.has_backend != '0'
        working-directory: backend
        run: npm ci --prefer-offline

      - name: TypeScript strict check
        id: ts_check
        if: steps.changed.outputs.has_backend != '0'
        working-directory: backend
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/ts_errors.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Detect schema / migration issues
        id: schema_check
        if: steps.changed.outputs.has_migrations != '0'
        run: |
          ISSUES=""
          # Entities without @Column on required fields
          while IFS= read -r f; do
            if [[ "$f" == *.entity.ts ]]; then
              # Warn on fields lacking @Column that appear to be DB props
              BARE=$(grep -n '^\s\+[a-z][A-Za-z]*:' "$f" | grep -v '//' | grep -v '@' | head -5 || true)
              if [ -n "$BARE" ]; then
                ISSUES="${ISSUES}\n⚠️ $(basename $f): поля без декоратора @Column:\n${BARE}"
              fi
              # Warn on missing @Index on FK columns
              FK=$(grep -n 'ManyToOne\|OneToMany' "$f" | head -3 || true)
              if [ -n "$FK" ]; then
                ISSUES="${ISSUES}\n📌 $(basename $f): отношения (проверь индексы): $(echo $FK | head -c 200)"
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"

          # SQL migration checks
          while IFS= read -r f; do
            if [[ "$f" == *.sql ]]; then
              # Detect DROP TABLE or DROP COLUMN without IF EXISTS
              DANGEROUS=$(grep -inE 'DROP (TABLE|COLUMN)' "$f" | grep -iv 'IF EXISTS' | head -5 || true)
              if [ -n "$DANGEROUS" ]; then
                ISSUES="${ISSUES}\n🚨 $(basename $f): опасные DROP без IF EXISTS:\n${DANGEROUS}"
              fi
              # Detect missing NOT NULL without DEFAULT
              NOTNULL=$(grep -inE 'ADD COLUMN.*NOT NULL' "$f" | grep -iv 'DEFAULT' | head -5 || true)
              if [ -n "$NOTNULL" ]; then
                ISSUES="${ISSUES}\n⚠️ $(basename $f): NOT NULL без DEFAULT (опасно на prod):\n${NOTNULL}"
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"

          echo "issues<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ─── go2rtc / streaming audit ────────────────────────────────────────────
      - name: Audit go2rtc error handling
        id: go2rtc_check
        if: steps.changed.outputs.has_go2rtc != '0' || steps.changed.outputs.has_control != '0'
        run: |
          ISSUES=""
          TARGET_FILES=$(echo "${{ steps.changed.outputs.files }}" | grep -E '(go2rtc|control\.service)' || true)
          for f in $TARGET_FILES; do
            [ -f "$f" ] || continue
            # Check that every async function has try/catch
            ASYNC_COUNT=$(grep -c 'async ' "$f" || true)
            TRY_COUNT=$(grep -c 'try {' "$f" || true)
            if [ "$ASYNC_COUNT" -gt "$TRY_COUNT" ]; then
              DIFF=$((ASYNC_COUNT - TRY_COUNT))
              ISSUES="${ISSUES}\n⚠️ $(basename $f): ${DIFF} async-функций могут не иметь try/catch"
            fi
            # Check HTTP calls without error handling
            HTTP_CALLS=$(grep -c 'this\.http\.\|axios\.\|fetch(' "$f" || true)
            CATCH_BLOCKS=$(grep -c '\.catch\|catch (err' "$f" || true)
            if [ "$HTTP_CALLS" -gt 0 ] && [ "$CATCH_BLOCKS" -eq 0 ]; then
              ISSUES="${ISSUES}\n🚨 $(basename $f): HTTP-вызовы без обработки ошибок!"
            fi
            # Check timeout on HTTP calls
            if grep -q 'this\.http\.\|axios\.' "$f" && ! grep -q 'timeout' "$f"; then
              ISSUES="${ISSUES}\n⚠️ $(basename $f): HTTP без явного таймаута"
            fi
          done
          echo "issues<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ─── Flutter audit ───────────────────────────────────────────────────────
      - name: Audit Flutter UI structure
        id: flutter_check
        if: steps.changed.outputs.has_flutter != '0'
        run: |
          ISSUES=""
          FL_FILES=$(echo "${{ steps.changed.outputs.files }}" | grep -E '^lib/' || true)
          for f in $FL_FILES; do
            [ -f "$f" ] || continue
            # Screens should be inside lib/screens/
            if [[ "$f" == lib/screens/* ]]; then
              # Warn if screen directly instantiates BackendClient without service layer
              if grep -q 'BackendClient()' "$f"; then
                ISSUES="${ISSUES}\n⚠️ $(basename $f): прямой вызов BackendClient() в экране (используй сервис)"
              fi
              # Warn on missing error handling in async calls
              ASYNC_COUNT=$(grep -c 'await ' "$f" || true)
              TRY_COUNT=$(grep -c 'try {' "$f" || true)
              if [ "$ASYNC_COUNT" -gt $((TRY_COUNT * 2 + 2)) ]; then
                ISSUES="${ISSUES}\n⚠️ $(basename $f): много await без try/catch (async=${ASYNC_COUNT}, try=${TRY_COUNT})"
              fi
            fi
            # Widgets should be in lib/widgets/
            if [[ "$f" == lib/widgets/* ]]; then
              if grep -q 'StatefulWidget' "$f" && ! grep -q 'dispose()' "$f"; then
                ISSUES="${ISSUES}\n⚠️ $(basename $f): StatefulWidget без dispose() — возможная утечка"
              fi
            fi
            # Models should not contain UI code
            if [[ "$f" == lib/models/* ]]; then
              if grep -qE 'Widget|BuildContext|Scaffold' "$f"; then
                ISSUES="${ISSUES}\n🚨 $(basename $f): UI-код внутри модели — нарушение архитектуры"
              fi
            fi
          done
          echo "issues<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ─── Compose & send report ───────────────────────────────────────────────
      - name: Compose Telegram report
        id: report
        run: |
          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "$EVENT" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            HEADER="🔀 *Pull Request #${PR_NUM}*: ${PR_TITLE}"
          else
            COMMIT_MSG=$(git log --format=%s -1 "$SHA" 2>/dev/null || echo "")
            HEADER="📦 *Push* \`${SHORT_SHA}\`: ${COMMIT_MSG}"
          fi

          CHANGED_LIST=$(echo "${{ steps.changed.outputs.files }}" | head -15 | sed 's/^/  • /' || true)
          TOTAL=$(echo "${{ steps.changed.outputs.files }}" | wc -l | tr -d ' ')

          REPORT="${HEADER}

*Репозиторий*: \`${REPO}\`
*Ветка*: \`${BRANCH}\`
*Автор*: ${ACTOR}

*Изменено файлов*: ${TOTAL}
\`\`\`
${CHANGED_LIST}
\`\`\`"

          # Backend section
          if [ "${{ steps.changed.outputs.has_backend }}" != "0" ]; then
            TS_EXIT="${{ steps.ts_check.outputs.exit_code }}"
            if [ "$TS_EXIT" = "0" ]; then
              TS_STATUS="✅ TypeScript: OK"
            else
              TS_ERRORS=$(head -10 /tmp/ts_errors.txt 2>/dev/null | sed 's/"/\\"/g' || true)
              TS_STATUS="❌ TypeScript: ошибки\n\`\`\`\n${TS_ERRORS}\n\`\`\`"
            fi

            SCHEMA_ISSUES="${{ steps.schema_check.outputs.issues }}"
            if [ -n "$SCHEMA_ISSUES" ]; then
              SCHEMA_STATUS="⚠️ Схема/миграции: проблемы найдены\n${SCHEMA_ISSUES}"
            else
              SCHEMA_STATUS="✅ Схема/миграции: OK"
            fi

            REPORT="${REPORT}

🖥️ *Backend (NestJS)*
${TS_STATUS}
${SCHEMA_STATUS}"
          fi

          # go2rtc section
          if [ "${{ steps.changed.outputs.has_go2rtc }}" != "0" ] || [ "${{ steps.changed.outputs.has_control }}" != "0" ]; then
            G2R_ISSUES="${{ steps.go2rtc_check.outputs.issues }}"
            if [ -n "$G2R_ISSUES" ]; then
              G2R_STATUS="⚠️ go2rtc/стриминг: проблемы\n${G2R_ISSUES}"
            else
              G2R_STATUS="✅ go2rtc/стриминг: обработка ошибок OK"
            fi
            REPORT="${REPORT}

📹 *Видеостриминг (go2rtc)*
${G2R_STATUS}"
          fi

          # Flutter section
          if [ "${{ steps.changed.outputs.has_flutter }}" != "0" ]; then
            FL_ISSUES="${{ steps.flutter_check.outputs.issues }}"
            if [ -n "$FL_ISSUES" ]; then
              FL_STATUS="⚠️ Flutter UI: проблемы найдены\n${FL_ISSUES}"
            else
              FL_STATUS="✅ Flutter UI: структура OK"
            fi
            REPORT="${REPORT}

📱 *Flutter*
${FL_STATUS}"
          fi

          # Overall verdict
          HAS_CRITICAL=$(echo "$REPORT" | grep -c '🚨' || true)
          HAS_WARNINGS=$(echo "$REPORT" | grep -c '⚠️' || true)
          if [ "$HAS_CRITICAL" -gt 0 ]; then
            VERDICT="🚨 *Критические проблемы: ${HAS_CRITICAL}* — требует внимания!"
          elif [ "$HAS_WARNINGS" -gt 0 ]; then
            VERDICT="⚠️ Предупреждений: ${HAS_WARNINGS} — рекомендуется проверить"
          else
            VERDICT="✅ Изменения соответствуют архитектуре"
          fi

          REPORT="${REPORT}

─────────────────────
${VERDICT}
🤖 GRG Mobile Audit Bot"

          # Escape for JSON
          REPORT_JSON=$(printf '%s' "$REPORT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          echo "report_json=$REPORT_JSON" >> $GITHUB_OUTPUT

      - name: Send report to Telegram
        run: |
          REPORT=${{ steps.report.outputs.report_json }}
          HTTP_CODE=$(curl -s -o /tmp/tg_response.txt -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": ${REPORT},
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }")
          echo "Telegram API response code: $HTTP_CODE"
          cat /tmp/tg_response.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Telegram notification failed (HTTP $HTTP_CODE)"
          fi
